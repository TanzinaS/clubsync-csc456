
name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Flask backend
        run: |
          FRONTEND_ORIGIN=http://127.0.0.1:4173 python backend/app.py > /tmp/clubsync-flask.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/events > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clubsync-flask.log
          exit 1

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5001
        run: npm run build

      - name: Start frontend preview
        working-directory: frontend
        run: |
          npm run preview -- --port 4173 > /tmp/clubsync-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clubsync-preview.log
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
