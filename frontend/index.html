<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubSync — Coming Soon</title>
  <!-- Temporary demo page. It will be replaced by the real frontend. -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
      text-align: center;
    }
    #backend-status {
      margin-top: 24px;
      padding: 8px 16px;
      border-radius: 6px;
      background: #e0e0e0;
    }
    #backend-status.connected { background: #d4f5dc; color: #1b6b30; }
    #backend-status.unreachable { background: #fbdada; color: #8a1c1c; }
  </style>
</head>
<body>
  <h1>ClubSync — Coming Soon</h1>
  <p>Discover CCNY club events and keep track of them in one place.</p>
  <p id="backend-status">Checking backend...</p>

  <script src="src/services/api.js"></script>
  <script>
    const statusElement = document.getElementById("backend-status");

    checkBackendHealth().then((isConnected) => {
      if (isConnected) {
        statusElement.textContent = "Backend Connected";
        statusElement.className = "connected";
      } else {
        statusElement.textContent = "Backend Not Reachable";
        statusElement.className = "unreachable";
      }
    });
  </script>
</body>
</html>
